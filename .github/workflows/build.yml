name: build.yml

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build, Test, and Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pip install pytest coverage
          pytest --cov=your_package --cov-report=xml:coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.3
        env:
          SONAR_TOKEN: ${{ 6875f17409c7ba69b1d4495f19ebb6e95e6ecde9 }}
        with:
          args: >
            -Dsonar.organization=AnatoliySigutin
            -Dsonar.projectKey=AnatoliySigutin_python-project-50
            -Dsonar.python.coverage.reportPaths=/home/user/python-project-50/coverage.xml
            -Dsonar.exclusions=tests/**,*/tests/** # 
            -Dsonar.coverage.exclusions=tests/**,*/tests/**
